# docker-compose.mtls.yml — mTLS overlay
#
# Enables TLS on every inter-service connection:
#   authd HTTPS API         AUTHD_API_CERT / AUTHD_API_KEY
#   NATS server TLS + mTLS  --tls / --tlsverify + client certs on both sides
#   authd → postgres        client cert + cert auth (no password in DSN)
#   authd → NATS            client cert (publisher + reader identity)
#   authd → outbound SCIM   AUTHD_SCIM_MTLS_CERT / KEY (CA falls back to
#                           AUTHD_WORKLOAD_CA; used by app_integrations rows
#                           with auth_mode=mtls)
#
# The shared workload CA is exposed once via AUTHD_WORKLOAD_CA below; per-channel
# CA env vars (AUTHD_DB_CA / AUTHD_NATS_CA / AUTHD_SCIM_MTLS_CA / AUTHD_ADMIN_DB_CA)
# stay supported for stricter deployments that want a different anchor per
# channel — leave them unset to inherit AUTHD_WORKLOAD_CA.
#
# Prerequisites:
#   1. make docker-up-mtls   # auto-generates leaf certs (signed by mkcert's
#                            # root) and populates the shared_data volume.
#                            # The root CA is mkcert's, kept at $(mkcert -CAROOT)
#                            # — _sync-shared stages it into /shared/certs/ca.crt
#                            # for the mounts referenced below.
#
#   To regenerate leaf certs: rm shared/certs/authd-server.crt, then re-run make docker-up-mtls.
#   To rotate the root CA:    mkcert -uninstall && mkcert -install on the host.
#
# PostgreSQL cert auth:
#   pg_hba_cert.conf replaces the default pg_hba.conf. All TCP connections must
#   use TLS with a client cert whose CN matches the connecting role name:
#     authd-admin-db-client.crt   CN=${AUTHD_ADMIN_DB_USERNAME:-auth_admin}  → AUTHD_ADMIN_DATABASE_URL
#     authd-app-db-client.crt     CN=${AUTHD_DB_USERNAME:-auth_app}          → AUTHD_DATABASE_URL
#   If any username env var is changed from its default, remove the shared_data
#   volume and re-run to regenerate certs with the correct CNs.

services:

  # ── Auth database: enable server TLS + cert auth ──────────────────────────
  # shared_data:/shared is already mounted by the base file (for postgres scripts).
  db:
    environment:
      POSTGRES_SSL_CERT: /shared/certs/db-server.crt
      POSTGRES_SSL_KEY:  /shared/certs/db-server.key
      POSTGRES_SSL_CA:   /shared/certs/ca.crt

  # ── NATS: enable server TLS + require client certs ────────────────────────
  nats:
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--tls"
      - "--tlscert=/shared/certs/nats-server.crt"
      - "--tlskey=/shared/certs/nats-server.key"
      - "--tlscacert=/shared/certs/ca.crt"
      - "--tlsverify"
      - "-m"
      - "8222"
    volumes:
      - shared_data:/shared:ro

  # ── nats-box: TLS context + stream provisioner ────────────────────────────
  # Reuses authd-nats-client.crt for both stream provisioning and interactive
  # inspection — the dev NATS server has no per-subject auth, so a valid
  # client cert grants full access. A `default` nats context is saved at
  # startup so subsequent CLI calls inherit the TLS settings:
  #   docker compose exec natsbox nats sub 'auth.audit.events'
  natsbox:
    environment:
      NATS_URL: tls://nats:4222
    command:
      - |
        set -e
        nats context save default \
          --server tls://nats:4222 \
          --tlscert /shared/certs/authd-nats-client.crt \
          --tlskey /shared/certs/authd-nats-client.key \
          --tlsca /shared/certs/ca.crt \
          --select > /dev/null
        nats stream info auth_audit > /dev/null 2>&1 || \
          nats stream add auth_audit \
            --subjects 'auth.audit.events' \
            --retention limits \
            --storage file \
            --max-age 9600h \
            --deny-delete \
            --deny-purge \
            --defaults
        exec tail -f /dev/null
    volumes:
      - shared_data:/shared:ro

  # ── authd: mTLS certs for NATS and Postgres ───────────────────────────────
  # The HTTPS API cert (AUTHD_API_CERT/AUTHD_API_KEY) is already wired in the
  # base compose — this overlay only adds the client-side mTLS material.
  authd:
    environment:
      # Single workload CA root — every internal mTLS channel inherits this
      # unless overridden by a per-channel AUTHD_*_CA below.
      AUTHD_WORKLOAD_CA:        /shared/certs/ca.crt
      AUTHD_ADMIN_DB_CERT:      /shared/certs/authd-admin-db-client.crt
      AUTHD_ADMIN_DB_KEY:       /shared/certs/authd-admin-db-client.key
      # Cert auth: no password; cert CN authenticates the role.
      AUTHD_ADMIN_DATABASE_URL: postgres://${AUTHD_ADMIN_DB_USERNAME:-auth_admin}@db:5432/authdb?sslmode=verify-full
      AUTHD_DB_CERT:            /shared/certs/authd-app-db-client.crt
      AUTHD_DB_KEY:             /shared/certs/authd-app-db-client.key
      # Cert auth: no password; cert CN authenticates the role.
      AUTHD_DATABASE_URL:       postgres://${AUTHD_DB_USERNAME:-auth_app}@db:5432/authdb?sslmode=verify-full
      # Outbound SCIM mTLS — single shared identity (CN=authd) presented to
      # every app_integrations row with auth_mode=mtls.
      AUTHD_SCIM_MTLS_CERT:     /shared/certs/authd-scim-client.crt
      AUTHD_SCIM_MTLS_KEY:      /shared/certs/authd-scim-client.key
      AUTHD_NATS_CERT:          /shared/certs/authd-nats-client.crt
      AUTHD_NATS_KEY:           /shared/certs/authd-nats-client.key
      AUTHD_NATS_URL:           tls://nats:4222
