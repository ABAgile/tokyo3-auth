# docker-compose.mtls.yml — mTLS overlay
#
# Enables TLS on every inter-service connection:
#   authd HTTPS API         AUTH_API_CERT / AUTH_API_KEY
#   NATS server TLS + mTLS  --tls / --tlsverify + client certs on both sides
#   authd → postgres        client cert + cert auth (no password in DSN)
#   authd → NATS            client cert (publisher + reader identity)
#   authd → outbound SCIM   AUTH_SCIM_CERT / KEY / CA (used by
#                           app_integrations rows with auth_mode=mtls)
#
# Prerequisites:
#   1. make docker-up-mtls   # auto-generates leaf certs (signed by mkcert's
#                            # root) and populates the shared_data volume.
#                            # The root CA is mkcert's, kept at $(mkcert -CAROOT)
#                            # — _sync-certs stages it into /shared/certs/ca.crt
#                            # for the mounts referenced below.
#
#   To regenerate leaf certs: rm certs/authd-server.crt, then re-run make docker-up-mtls.
#   To rotate the root CA:    mkcert -uninstall && mkcert -install on the host.
#
# PostgreSQL cert auth:
#   pg_hba_cert.conf replaces the default pg_hba.conf. All TCP connections must
#   use TLS with a client cert whose CN matches the connecting role name:
#     authd-admin-db-client.crt   CN=${AUTH_ADMIN_DB_USERNAME:-auth_admin}  → AUTH_ADMIN_DATABASE_URL
#     authd-app-db-client.crt     CN=${AUTH_DB_USERNAME:-auth_app}          → AUTH_DATABASE_URL
#   If any username env var is changed from its default, remove the shared_data
#   volume and re-run to regenerate certs with the correct CNs.

services:

  # ── Auth database: enable server TLS + cert auth ──────────────────────────
  # shared_data:/shared is already mounted by the base file (for pg-scripts).
  db:
    environment:
      POSTGRES_SSL_CERT: /shared/certs/db-server.crt
      POSTGRES_SSL_KEY:  /shared/certs/db-server.key
      POSTGRES_SSL_CA:   /shared/certs/ca.crt

  # ── NATS: enable server TLS + require client certs ────────────────────────
  nats:
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--tls"
      - "--tlscert=/shared/certs/nats-server.crt"
      - "--tlskey=/shared/certs/nats-server.key"
      - "--tlscacert=/shared/certs/ca.crt"
      - "--tlsverify"
      - "-m"
      - "8222"
    volumes:
      - shared_data:/shared:ro

  # ── nats-box: TLS context + stream provisioner ────────────────────────────
  # Reuses authd-nats-client.crt for both stream provisioning and interactive
  # inspection — the dev NATS server has no per-subject auth, so a valid
  # client cert grants full access. A `default` nats context is saved at
  # startup so subsequent CLI calls inherit the TLS settings:
  #   docker compose exec natsbox nats sub 'auth.audit.events'
  natsbox:
    environment:
      NATS_URL: tls://nats:4222
    command:
      - |
        set -e
        nats context save default \
          --server tls://nats:4222 \
          --tlscert /shared/certs/authd-nats-client.crt \
          --tlskey /shared/certs/authd-nats-client.key \
          --tlsca /shared/certs/ca.crt \
          --select > /dev/null
        nats stream info auth_audit > /dev/null 2>&1 || \
          nats stream add auth_audit \
            --subjects 'auth.audit.events' \
            --retention limits \
            --storage file \
            --max-age 9600h \
            --deny-delete \
            --deny-purge \
            --defaults
        exec tail -f /dev/null
    volumes:
      - shared_data:/shared:ro

  # ── authd: HTTPS + mTLS certs for NATS and Postgres ───────────────────────
  auth:
    environment:
      AUTH_API_CERT:           /shared/certs/authd-server.crt
      AUTH_API_KEY:            /shared/certs/authd-server.key
      AUTH_ADMIN_DB_CERT:      /shared/certs/authd-admin-db-client.crt
      AUTH_ADMIN_DB_KEY:       /shared/certs/authd-admin-db-client.key
      AUTH_ADMIN_DB_CA:        /shared/certs/ca.crt
      # Cert auth: no password; cert CN authenticates the role.
      AUTH_ADMIN_DATABASE_URL: postgres://${AUTH_ADMIN_DB_USERNAME:-auth_admin}@db:5432/authdb?sslmode=verify-full
      AUTH_DB_CERT:            /shared/certs/authd-app-db-client.crt
      AUTH_DB_KEY:             /shared/certs/authd-app-db-client.key
      AUTH_DB_CA:              /shared/certs/ca.crt
      # Cert auth: no password; cert CN authenticates the role.
      AUTH_DATABASE_URL:       postgres://${AUTH_DB_USERNAME:-auth_app}@db:5432/authdb?sslmode=verify-full
      # Outbound SCIM mTLS — single shared identity (CN=authd) presented to
      # every app_integrations row with auth_mode=mtls.
      AUTH_SCIM_CERT:          /shared/certs/authd-scim-client.crt
      AUTH_SCIM_KEY:           /shared/certs/authd-scim-client.key
      AUTH_SCIM_CA:            /shared/certs/ca.crt
      AUTH_NATS_CERT:          /shared/certs/authd-nats-client.crt
      AUTH_NATS_KEY:           /shared/certs/authd-nats-client.key
      AUTH_NATS_CA:            /shared/certs/ca.crt
      AUTH_NATS_URL:           tls://nats:4222
    volumes:
      - shared_data:/shared:ro
