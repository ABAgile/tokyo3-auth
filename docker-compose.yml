# docker-compose.yml — standalone auth development stack.
#
# Use `make docker-up` for the local Postgres/NATS stack, or
# `make docker-up-mesh` after `cd ../ca && make docker-up` to run authd on the
# CA-owned tokyo3_backplane/tokyo3_idp networks.

name: ${COMPOSE_PROJECT_NAME:-tokyo3_auth}

x-default-environment: &default-environment
  TZ: ${TZ:-Asia/Taipei}

services:

  # ── Auth database ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    entrypoint: ["sh", "/shared/postgres/pg-entrypoint.sh"]
    environment:
      <<: *default-environment
      PG_INIT_SCRIPT: /shared/postgres/db-init.sh
      POSTGRES_USER:  authd_admin
      POSTGRES_DB:    authd
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - shared_data:/shared:ro
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authd_admin -d authd"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── NATS JetStream (authoritative audit event store) ──────────────────────
  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    environment:
      <<: *default-environment
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      # Tight interval + start_period so the dependent natsbox container
      # unblocks in ~2s instead of the default 10s.
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # ── nats-box: stream provisioner + interactive shell ──────────────────────
  # On startup, ensures the auth_audit JetStream stream exists. Without it,
  # authd's first audit publish would fail (no stream covers the subject) and
  # every audit-emitting handler would 503 fail-closed. Provisioning it here
  # keeps authd's publisher credential PUBLISH-only.
  natsbox:
    # Pinned (not :latest) so docker doesn't query the registry on every up
    # to check for a digest update.
    image: natsio/nats-box:${NATSBOX_VERSION:-0.19.5}
    depends_on:
      nats:
        condition: service_healthy
    environment:
      <<: *default-environment
      NATS_URL: nats://nats:4222
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        nats stream info auth_audit > /dev/null 2>&1 || \
          nats stream add auth_audit \
            --subjects 'auth.audit.events' \
            --retention limits \
            --storage file \
            --max-age 9600h \
            --deny-delete \
            --deny-purge \
            --defaults
        exec tail -f /dev/null
    healthcheck:
      # Same tight interval as nats above — the stream-info probe completes
      # in milliseconds, so polling every 2s is cheap.
      test: ["CMD-SHELL", "nats stream info auth_audit > /dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  # ── authd server ────────────────────────────────────────────────────────────
  # Reached via Traefik at https://auth.localhost (host:443).
  # No host port mapping: all browser and issuer traffic goes through Traefik.
  authd:
    build:
      context: .
      target: server
      args:
        VERSION: ${VERSION:-dev-docker}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      natsbox:
        condition: service_healthy
    networks:
      default: {}
    environment:
      <<: *default-environment
      AUTHD_BACKCHANNEL_CA:      /shared/certs/traefik-ca.crt
      AUTHD_MASTER_KEY:          file:/shared/secrets/authd-master.key
      AUTHD_ADDR:                ":8443"
      AUTHD_ISSUER:              https://auth.localhost
      AUTHD_API_CERT:            /shared/certs/traefik.crt
      AUTHD_API_KEY:             /shared/certs/traefik.key
      AUTHD_ADMIN_DATABASE_URL:  postgres://authd_admin@postgres:5432/authd?sslmode=disable
      AUTHD_DATABASE_URL:        postgres://authd_app@postgres:5432/authd?sslmode=disable
      # Audit sink + source (live tail page + `authd audit query` CLI):
      # publish to and read from the auth_audit JetStream stream.
      AUTHD_NATS_URL:            nats://nats:4222
      AUTHD_ALLOW_REGISTRATION:  ${AUTHD_ALLOW_REGISTRATION:-false}
      AUTHD_WEBAUTHN_ORIGINS:    ${AUTHD_WEBAUTHN_ORIGINS:-}
      AUTHD_WEBAUTHN_RPID:       ${AUTHD_WEBAUTHN_RPID:-}
      # AWS OIDC federation (per-role tile + auth-aws-creds CLI). Set the
      # audience to the value registered on each account's IAM OIDC
      # provider. Empty disables the federation handler; setup runbook is
      # in README's "AWS OIDC Federation" section.
      AUTHD_AWS_AUDIENCE:        ${AUTHD_AWS_AUDIENCE:-}
      # Standard AWS SDK credential env vars — consumed by the SDK's
      # default credential chain inside the IAM provisioner and the
      # federation revocation provisioner. Empty values let the chain
      # fall through to a machine IAM role (EC2 instance profile, ECS
      # task role, EKS IRSA, IAM Roles Anywhere), which is the
      # recommended production path. The federation flow itself needs
      # no AWS credentials.
      AWS_REGION:               ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID:        ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:    ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - shared_data:/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Front-proxy ───────────────────────────────────────────────────────────
  # Listens on host:443, terminates TLS with the mkcert-issued edge cert, and
  # routes by virtual host per /shared/traefik/dynamic.yml.
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.7}
    ports:
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    depends_on:
      authd:
        condition: service_healthy
    environment:
      <<: *default-environment
    command:
      - "--api.dashboard=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.ping.address=:8082"
      - "--ping=true"
      - "--ping.entryPoint=ping"
      - "--providers.file.filename=/shared/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--experimental.plugins.rewriteResponseHeaders.moduleName=github.com/jamesmcroft/traefik-plugin-rewrite-response-headers"
      - "--experimental.plugins.rewriteResponseHeaders.version=v1.1.2"
      - "--log.level=INFO"
    volumes:
      - shared_data:/shared:ro
    networks:
      default:
        aliases:
          - auth.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # ── Teleport ──────────────────────────────────────────────────────────────
  # Runs auth + proxy in the same process (proxy_listener_mode: multiplex).
  # Fronted by Traefik at https://teleport.localhost — no host port mapping
  # needed.
  teleport:
    image: ${TELEPORT_IMAGE:-public.ecr.aws/gravitational/teleport-distroless:18.8.0}
    depends_on:
      authd:
        condition: service_healthy
    extra_hosts:
      - "github.com:host-gateway"
      - "api.github.com:host-gateway"
    environment:
      <<: *default-environment
      SSL_CERT_FILE: /shared/certs/traefik-ca.crt
    volumes:
      - shared_data:/shared:ro
      - teleport_data:/var/lib/teleport
    # Override the image default config path with the shared volume config.
    entrypoint:
      - /usr/bin/dumb-init
      - /usr/local/bin/teleport
      - start
      - -c
      - /shared/teleport/teleport.yml
    restart: unless-stopped
    healthcheck:
      # tctl status exits 0 once the local auth API is reachable. CMD form
      # (no shell wrapper) — the distroless image has neither sh nor wget.
      # tctl finds the admin identity in /var/lib/teleport so no creds needed.
      test: ["CMD", "/usr/local/bin/tctl", "-c", "/shared/teleport/teleport.yml", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  shared_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-tokyo3_auth}_shared_data
  db_data:
  nats_data:
  teleport_data:
