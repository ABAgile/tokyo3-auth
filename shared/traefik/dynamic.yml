# Static Traefik dynamic configuration loaded via --providers.file.filename.
#
# Routing summary:
#   - auth.dev.localhost                -> authd:8443 (HTTPS upstream)
#   - traefik.dev.localhost             -> Traefik dashboard/API.
#
# TLS terminates at Traefik using the mkcert-issued dev.localhost wildcard cert.
# Upstream connections use insecureSkipVerify because the docker service-name
# SNI (`authd`) doesn't match the cert — adequate for a dev rig.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /shared/certs/dev.localhost.crt
        keyFile: /shared/certs/dev.localhost.key
  certificates:
    - certFile: /shared/certs/dev.localhost.crt
      keyFile: /shared/certs/dev.localhost.key

http:
  routers:
    authd:
      rule: "Host(`auth.dev.localhost`)"
      entryPoints: [websecure]
      service: authd
      tls: {}

    traefik-dashboard:
      rule: "Host(`traefik.dev.localhost`)"
      entryPoints: [websecure]
      service: api@internal
      tls: {}

  services:
    authd:
      loadBalancer:
        servers:
          - url: "https://authd:8443"
        serversTransport: skipverify

  serversTransports:
    skipverify:
      insecureSkipVerify: true
