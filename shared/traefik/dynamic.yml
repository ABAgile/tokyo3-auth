# Static Traefik dynamic configuration loaded via --providers.file.filename.
#
# Routing summary:
#   - auth.localhost                    -> authd:8443 (HTTPS upstream)
#   - traefik.localhost                 -> Traefik dashboard/API.
#
# TLS terminates at Traefik using the mkcert-issued edge cert. Upstream
# connections use insecureSkipVerify because the docker service-name SNI
# (`authd`) doesn't match the cert — adequate for a dev rig.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /shared/certs/traefik.crt
        keyFile: /shared/certs/traefik.key
  certificates:
    - certFile: /shared/certs/traefik.crt
      keyFile: /shared/certs/traefik.key

http:
  routers:
    authd:
      rule: "Host(`auth.localhost`)"
      entryPoints: [websecure]
      service: authd
      tls: {}

    traefik-dashboard:
      rule: "Host(`traefik.localhost`)"
      entryPoints: [websecure]
      service: api@internal
      tls: {}

  services:
    authd:
      loadBalancer:
        servers:
          - url: "https://authd:8443"
        serversTransport: skipverify

  serversTransports:
    skipverify:
      insecureSkipVerify: true
