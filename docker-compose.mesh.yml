# docker-compose.mesh.yml — authd on the CA-owned tokyo3 mesh.
# Requires `cd ../ca && make docker-up` first.

name: ${COMPOSE_PROJECT_NAME:-tokyo3_auth}

x-default-environment: &default-environment
  TZ: ${TZ:-Asia/Taipei}

services:
  authd-certs-ready:
    image: alpine:3.21
    volumes:
      - ${TOKYO3_SHARED_VOLUME:-tokyo3_shared_data}:/tokyo3:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 120); do
          ok=true
          for f in \
            /tokyo3/workloads/authd.crt /tokyo3/workloads/authd.key \
            /tokyo3/workloads/authd-db-app.crt /tokyo3/workloads/authd-db-app.key \
            /tokyo3/workloads/authd-db-admin.crt /tokyo3/workloads/authd-db-admin.key \
            /tokyo3/workloads/authd-nats.crt /tokyo3/workloads/authd-nats.key \
            /tokyo3/workloads/authd-scim.crt /tokyo3/workloads/authd-scim.key; do
            [ -s "$$f" ] || ok=false
          done
          if [ "$$ok" = true ]; then
            echo "authd-certs-ready: workload certs present"
            exit 0
          fi
          sleep 1
        done
        echo "authd-certs-ready: timed out waiting CA-managed workload certs" >&2
        exit 1
    restart: "no"

  authd:
    build:
      context: .
      target: server
      args:
        VERSION: ${VERSION:-dev-docker}
    image: abagile/tokyo3-auth:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      authd-certs-ready:
        condition: service_completed_successfully
    networks:
      tokyo3_backplane: {}
      tokyo3_idp: {}
    environment:
      <<: *default-environment
      AUTHD_BACKCHANNEL_CA: /shared/certs/traefik-ca.crt
      AUTHD_ADDR: ":8443"
      AUTHD_API_CERT: /tokyo3/workloads/authd.crt
      AUTHD_API_KEY: /tokyo3/workloads/authd.key
      AUTHD_ISSUER: https://auth.localhost
      AUTHD_MASTER_KEY: file:/shared/secrets/authd-master.key
      AUTHD_ALLOW_REGISTRATION: ${AUTHD_ALLOW_REGISTRATION:-false}
      AUTHD_WEBAUTHN_ORIGINS: ${AUTHD_WEBAUTHN_ORIGINS:-}
      AUTHD_WEBAUTHN_RPID: ${AUTHD_WEBAUTHN_RPID:-}
      AUTHD_AWS_AUDIENCE: ${AUTHD_AWS_AUDIENCE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      AUTHD_WORKLOAD_CA: /tokyo3/certs/certd-x509-ca.crt
      AUTHD_ADMIN_DATABASE_URL: "postgres://authd_admin@tokyo3-postgres:5432/authd?sslmode=verify-full"
      AUTHD_ADMIN_DB_CERT: /tokyo3/workloads/authd-db-admin.crt
      AUTHD_ADMIN_DB_KEY: /tokyo3/workloads/authd-db-admin.key
      AUTHD_ADMIN_DB_CA: /tokyo3/certs/certd-x509-ca.crt
      AUTHD_DATABASE_URL: "postgres://authd_app@tokyo3-postgres:5432/authd?sslmode=verify-full"
      AUTHD_DB_CERT: /tokyo3/workloads/authd-db-app.crt
      AUTHD_DB_KEY: /tokyo3/workloads/authd-db-app.key
      AUTHD_DB_CA: /tokyo3/certs/certd-x509-ca.crt
      AUTHD_NATS_URL: tls://tokyo3-nats:4222
      AUTHD_NATS_CERT: /tokyo3/workloads/authd-nats.crt
      AUTHD_NATS_KEY: /tokyo3/workloads/authd-nats.key
      AUTHD_SCIM_MTLS_CERT: /tokyo3/workloads/authd-scim.crt
      AUTHD_SCIM_MTLS_KEY: /tokyo3/workloads/authd-scim.key
    volumes:
      - shared_data:/shared:ro
      - ${TOKYO3_SHARED_VOLUME:-tokyo3_shared_data}:/tokyo3:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.7}
    ports:
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    depends_on:
      authd:
        condition: service_healthy
    environment:
      <<: *default-environment
    command:
      - "--api.dashboard=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.ping.address=:8082"
      - "--ping=true"
      - "--ping.entryPoint=ping"
      - "--providers.file.filename=/shared/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--experimental.plugins.rewriteResponseHeaders.moduleName=github.com/jamesmcroft/traefik-plugin-rewrite-response-headers"
      - "--experimental.plugins.rewriteResponseHeaders.version=v1.1.2"
      - "--log.level=INFO"
    volumes:
      - shared_data:/shared:ro
    networks:
      tokyo3_idp:
        aliases:
          - auth.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  teleport:
    image: ${TELEPORT_IMAGE:-public.ecr.aws/gravitational/teleport-distroless:18.8.0}
    depends_on:
      authd:
        condition: service_healthy
    networks:
      - tokyo3_idp
    extra_hosts:
      - "github.com:host-gateway"
      - "api.github.com:host-gateway"
    environment:
      <<: *default-environment
      SSL_CERT_FILE: /shared/certs/traefik-ca.crt
    volumes:
      - shared_data:/shared:ro
      - teleport_data:/var/lib/teleport
    entrypoint:
      - /usr/bin/dumb-init
      - /usr/local/bin/teleport
      - start
      - -c
      - /shared/teleport/teleport.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/tctl", "-c", "/shared/teleport/teleport.yml", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  shared_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-tokyo3_auth}_shared_data
  tokyo3_shared_data:
    external: true
    name: ${TOKYO3_SHARED_VOLUME:-tokyo3_shared_data}
  teleport_data:

networks:
  tokyo3_backplane:
    external: true
    name: ${TOKYO3_BACKPLANE_NETWORK:-tokyo3_backplane}
  tokyo3_idp:
    external: true
    name: ${TOKYO3_IDP_NETWORK:-tokyo3_idp}
