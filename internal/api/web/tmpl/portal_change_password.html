{{template "base" .}}

{{define "title"}}Change password{{end}}

{{define "content"}}
<h1>Change your password</h1>
<p class="subtitle">An administrator has reset your password. Set a new one to continue.</p>

{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

<form method="POST" action="/portal/login/change-password" autocomplete="off">
  <div class="form-group">
    <label>Account</label>
    <input type="text" value="{{.Email}}" disabled>
  </div>
  <div class="form-group">
    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" required autofocus autocomplete="new-password">
  </div>
  <div class="form-group">
    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Set new password</button>
</form>
{{end}}
