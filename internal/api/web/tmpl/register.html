{{template "base" .}}

{{define "title"}}Create account{{end}}

{{define "content"}}
<h1>Create account</h1>
<p class="subtitle">Register to continue</p>

{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

<form method="POST" action="/register">
  <input type="hidden" name="client_id" value="{{.ClientID}}">
  <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
  <input type="hidden" name="response_type" value="{{.ResponseType}}">
  <input type="hidden" name="scope" value="{{.Scope}}">
  <input type="hidden" name="state" value="{{.State}}">
  <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
  <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
  <input type="hidden" name="nonce" value="{{.Nonce}}">

  <div class="form-group">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" value="{{.Name}}" required autofocus autocomplete="name">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" required autocomplete="email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
    <p class="text-muted" style="margin-top:4px;font-size:12px">Min 12 chars, must include upper, lower, digit, and special character.</p>
  </div>

  <button type="submit" class="btn btn-primary btn-block" style="margin-top:4px">Create account</button>
</form>

<p class="text-muted mt-4" style="text-align:center">
  Already have an account? <a href="/authorize?{{.QueryString}}">Sign in</a>
</p>
{{end}}
