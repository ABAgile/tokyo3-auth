{{template "base" .}}

{{define "title"}}Create account{{end}}

{{define "content"}}
<h1>Create account</h1>
<p class="subtitle">Register a new portal account.</p>

{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

<form method="POST" action="/portal/register">
  <div class="form-group">
    <label for="name">Display name</label>
    <input type="text" id="name" name="name" value="{{.Name}}" autofocus autocomplete="name">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" required autocomplete="email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
  </div>
  <div class="form-group">
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="form-footer"><a href="/portal/login">Already have an account? Sign in</a></p>
{{end}}
