{{template "base" .}}

{{define "title"}}Security key{{end}}

{{define "content"}}
<h1>Use your security key</h1>
<p class="subtitle">Touch your security key or use biometrics to continue.</p>

{{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}

<div class="wa-challenge">
  <span class="spinner" id="wa-spinner" aria-hidden="true"></span>
  <p id="wa-status" role="status" aria-live="polite">Waiting for authenticator…</p>
</div>
<button type="button" id="wa-retry" class="btn btn-secondary btn-block" hidden onclick="startWA()">Try again</button>
{{end}}

{{define "scripts"}}
<script>
async function startWA() {
  document.getElementById("wa-retry").hidden = true;
  document.getElementById("wa-spinner").style.display = "inline-block";
  try {
    await waSSOLogin(
      "/authorize/mfa/webauthn/begin",
      "/authorize/mfa/webauthn/finish",
    );
  } catch(e) {
    document.getElementById("wa-status").textContent = "Error: " + e.message;
    document.getElementById("wa-spinner").style.display = "none";
    document.getElementById("wa-retry").hidden = false;
  }
}
startWA();
</script>
{{end}}
