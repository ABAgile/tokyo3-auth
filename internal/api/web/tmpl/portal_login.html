{{template "base" .}}

{{define "title"}}Portal sign in{{end}}

{{define "content"}}
<h1>Portal sign in</h1>
<p class="subtitle">Manage your account and settings.</p>

{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

<form method="POST" action="/portal/login">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" required autofocus autocomplete="email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>
{{if .AllowRegister}}
<p class="form-footer"><a href="/portal/register">No account? Create one</a></p>
{{end}}
{{end}}
