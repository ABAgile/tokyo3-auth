{{template "base" .}}

{{define "title"}}Connect your device{{end}}

{{define "content"}}
<h1>Connect your device</h1>
<p class="subtitle">Enter the code shown by your device to continue.</p>

{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

<form method="POST" action="/device">
  <div class="form-group">
    <label for="user_code">Device code</label>
    <input type="text" id="user_code" name="user_code"
           class="code-input" style="text-transform:uppercase;letter-spacing:0.2em;font-family:monospace"
           value="{{.UserCode}}"
           placeholder="ABCD-WXYZ"
           autocomplete="off" autocorrect="off" spellcheck="false"
           autofocus required>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Continue</button>
</form>
{{end}}
